<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b6178"/>
    </marker>
  </defs>
  <rect width="1180" height="900" fill="#f5f6fa"/>

  <!-- Title -->
  <text x="590" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1c2033">TripCraft — Multi-Agent AI Travel Planning System</text>

  <!-- Web UI -->
  <rect x="440" y="56" width="300" height="52" rx="10" fill="#ffffff" stroke="#2f6fed" stroke-width="1.5"/>
  <text x="590" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2033">Web UI</text>
  <text x="590" y="96" text-anchor="middle" font-size="11" fill="#6b7086">chat + approve / revise</text>
  <line x1="590" y1="108" x2="590" y2="132" stroke="#5b6178" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="602" y="123" font-size="10" fill="#6b7086">HTTP</text>

  <!-- FastAPI -->
  <rect x="380" y="132" width="420" height="56" rx="10" fill="#ffffff" stroke="#2f6fed" stroke-width="1.5"/>
  <text x="590" y="153" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2033">FastAPI  app.py</text>
  <text x="590" y="171" text-anchor="middle" font-size="11" fill="#6b7086">POST /api/travel · POST /api/travel/approve · GET /health</text>
  <line x1="590" y1="188" x2="590" y2="212" stroke="#5b6178" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Input Guardrail -->
  <rect x="410" y="212" width="360" height="46" rx="10" fill="#fff4e0" stroke="#b8860b" stroke-width="1.5"/>
  <text x="590" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#6b4b00">Input Guardrails</text>
  <text x="960" y="240" font-size="11" fill="#6b7086" text-anchor="start">injection / out-of-scope / missing-detail checks</text>
  <line x1="590" y1="258" x2="590" y2="282" stroke="#5b6178" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LangGraph state machine outer box -->
  <rect x="60" y="282" width="1060" height="500" rx="14" fill="#ffffff" stroke="#e2e5ec" stroke-width="1.5"/>
  <text x="80" y="308" font-size="13" font-weight="700" fill="#1c2033">LangGraph State Machine (backend.py) — MemorySaver checkpointer, thread_id-scoped</text>

  <!-- Supervisor -->
  <rect x="470" y="326" width="240" height="52" rx="10" fill="#e8effe" stroke="#2f6fed" stroke-width="1.5"/>
  <text x="590" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2033">Supervisor Agent</text>
  <text x="590" y="365" text-anchor="middle" font-size="10.5" fill="#6b7086">LLM router → next agent</text>

  <!-- 4 branches down to agents -->
  <line x1="590" y1="378" x2="590" y2="398" stroke="#5b6178" stroke-width="1.5"/>
  <line x1="590" y1="398" x2="180" y2="398" stroke="#5b6178" stroke-width="1.5"/>
  <line x1="590" y1="398" x2="420" y2="398" stroke="#5b6178" stroke-width="1.5"/>
  <line x1="590" y1="398" x2="760" y2="398" stroke="#5b6178" stroke-width="1.5"/>
  <line x1="590" y1="398" x2="1000" y2="398" stroke="#5b6178" stroke-width="1.5"/>
  <line x1="180" y1="398" x2="180" y2="418" stroke="#5b6178" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="398" x2="420" y2="418" stroke="#5b6178" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="398" x2="760" y2="418" stroke="#5b6178" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1000" y1="398" x2="1000" y2="418" stroke="#5b6178" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4 agent boxes -->
  <g>
    <rect x="90" y="418" width="180" height="56" rx="10" fill="#eef1f8" stroke="#8890ad" stroke-width="1.2"/>
    <text x="180" y="440" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2033">Weather Agent</text>
    <text x="180" y="458" text-anchor="middle" font-size="10" fill="#6b7086">via custom MCP server</text>
  </g>
  <g>
    <rect x="330" y="418" width="180" height="56" rx="10" fill="#eef1f8" stroke="#8890ad" stroke-width="1.2"/>
    <text x="420" y="440" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2033">Itinerary Agent</text>
    <text x="420" y="458" text-anchor="middle" font-size="10" fill="#6b7086">day-by-day plan</text>
  </g>
  <g>
    <rect x="670" y="418" width="180" height="56" rx="10" fill="#eef1f8" stroke="#8890ad" stroke-width="1.2"/>
    <text x="760" y="440" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2033">Flight/Hotel Agent</text>
    <text x="760" y="458" text-anchor="middle" font-size="10" fill="#6b7086">routes, stay areas, ranges</text>
  </g>
  <g>
    <rect x="910" y="418" width="180" height="56" rx="10" fill="#e4f6ec" stroke="#1c9d63" stroke-width="1.2"/>
    <text x="1000" y="440" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2033">Trip Compiler</text>
    <text x="1000" y="458" text-anchor="middle" font-size="10" fill="#6b7086">synthesizes draft plan</text>
  </g>

  <!-- back to supervisor from first 3 -->
  <line x1="180" y1="474" x2="180" y2="494" stroke="#5b6178" stroke-width="1.2"/>
  <line x1="420" y1="474" x2="420" y2="494" stroke="#5b6178" stroke-width="1.2"/>
  <line x1="760" y1="474" x2="760" y2="494" stroke="#5b6178" stroke-width="1.2"/>
  <line x1="180" y1="494" x2="590" y2="494" stroke="#5b6178" stroke-width="1.2"/>
  <line x1="420" y1="494" x2="590" y2="494" stroke="#5b6178" stroke-width="1.2"/>
  <line x1="760" y1="494" x2="590" y2="494" stroke="#5b6178" stroke-width="1.2"/>
  <line x1="590" y1="494" x2="590" y2="378" stroke="#5b6178" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="600" y="500" font-size="10" fill="#8890ad">loop back until Supervisor picks trip_compiler</text>

  <!-- Compiler down to output guardrail -->
  <line x1="1000" y1="474" x2="1000" y2="520" stroke="#5b6178" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output guardrail -->
  <rect x="850" y="520" width="300" height="50" rx="10" fill="#fff4e0" stroke="#b8860b" stroke-width="1.5"/>
  <text x="1000" y="542" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6b4b00">Output Guardrails</text>
  <text x="1000" y="558" text-anchor="middle" font-size="9.5" fill="#6b4b00">disclaimer · hedge language · unbacked specifics</text>

  <line x1="1000" y1="570" x2="1000" y2="596" stroke="#5b6178" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1010" y="588" font-size="9.5" fill="#8890ad">retry ≤2x on flagged output</text>
  <line x1="1000" y1="596" x2="1000" y2="474" stroke="#d1453d" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)" opacity="0.55"/>

  <!-- HITL -->
  <rect x="820" y="606" width="270" height="70" rx="10" fill="#e8effe" stroke="#2f6fed" stroke-width="1.5"/>
  <text x="955" y="630" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2033">HITL Interrupt</text>
  <text x="955" y="648" text-anchor="middle" font-size="10.5" fill="#6b7086">interrupt() pauses graph;</text>
  <text x="955" y="662" text-anchor="middle" font-size="10.5" fill="#6b7086">Approve → finalize · Revise → Supervisor</text>

  <line x1="1000" y1="570" x2="955" y2="606" stroke="#5b6178" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 820 640 C 650 640, 650 500, 590 378" fill="none" stroke="#2f6fed" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="660" y="560" font-size="9.5" fill="#2f6fed">revise feedback → Supervisor</text>

  <!-- MCP server -->
  <rect x="60" y="720" width="300" height="60" rx="10" fill="#ffffff" stroke="#1c9d63" stroke-width="1.5"/>
  <text x="210" y="744" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2033">custom_weather_mcp_server.py</text>
  <text x="210" y="762" text-anchor="middle" font-size="10" fill="#6b7086">Open-Meteo forecast / climate — no API key</text>
  <line x1="180" y1="474" x2="180" y2="600" stroke="#1c9d63" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="180" y1="600" x2="210" y2="600" stroke="#1c9d63" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="210" y1="600" x2="210" y2="720" stroke="#1c9d63" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="222" y="612" font-size="9.5" fill="#1c9d63">MCP protocol (stdio)</text>

  <text x="590" y="860" text-anchor="middle" font-size="11" fill="#6b7086">Groq (cloud) or Ollama (local) — swappable via LLM_PROVIDER env var</text>
</svg>
